<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPY-EQInfo</title>
<link rel="icon" href="icons/favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PPY-EQInfo</h1>
  <p class="subtitle">Global earthquakes, magnitude 6.0+ &mdash; source: USGS</p>
</header>

<main>
  <section id="controls">
    <button id="fetch-new-btn" title="Check USGS for new or updated earthquakes and fetch technical details only for those - skips events already cached. Only covers the past 365 days; use the USGS event ID lookup below for older earthquakes.">Fetch New</button>
    <button id="refetch-all-btn" title="Force refetch the full earthquake list and all technical details (moment tensor, ShakeMap) from USGS, even if already cached. Only covers the past 365 days; use the USGS event ID lookup below for older earthquakes.">Re-fetch All</button>
    <button id="time-toggle-btn" title="Toggle displayed times between UTC and your local timezone - all data is always stored in UTC">Time: UTC</button>
    <div id="location-control">
      <button id="location-toggle-btn" title="Set the location used to estimate local MMI / long-period shaking on the detail page">Location: Bangkok</button>
      <div id="location-popup" class="hidden">
        <label for="location-lat">Latitude</label>
        <input type="text" id="location-lat" inputmode="decimal" placeholder="-90 to 90" value="13.7563">
        <label for="location-lon">Longitude</label>
        <input type="text" id="location-lon" inputmode="decimal" placeholder="-180 to 180" value="100.5018">
        <p id="location-error" class="field-error hidden"></p>
        <label class="checkbox-label">
          <input type="checkbox" id="location-amplify">
          Apply Basin Amplification (Bangkok only)
        </label>
        <button id="location-apply-btn">Apply</button>
      </div>
    </div>
    <button id="db-export-btn" title="Download the current local database as a portable eqinfo.sqlite file - useful for backups or moving data to another browser/device">Export .sqlite</button>
    <button id="db-import-btn" title="Replace all earthquake data currently stored in this browser with the contents of a .sqlite file - overwrites everything here, so export first if you want to keep it">Import .sqlite</button>
    <input type="file" id="db-import-input" accept=".sqlite,.db,application/x-sqlite3" class="hidden">
    <span id="status"></span>
    <span id="db-status"></span>
  </section>

  <section id="lookup-bar">
    <label for="lookup-input">Look up USGS event ID:</label>
    <input type="text" id="lookup-input" placeholder="e.g. us7000pn9s" autocomplete="off">
    <button id="lookup-btn">Look Up</button>
    <span id="lookup-status"></span>
    <label for="location-search-input">Search location:</label>
    <input type="text" id="location-search-input" placeholder="e.g. myanmar" autocomplete="off">
  </section>

  <nav id="tab-bar">
    <button id="tab-list" class="tab-btn active">List &amp; Map</button>
    <button id="tab-detail" class="tab-btn" disabled>Details</button>
  </nav>

  <section id="list-section-wrap">
    <section id="map"></section>

    <section id="list-section">
      <table id="eq-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="time"><span id="time-col-label">Date &amp; Time (UTC)</span><span class="sort-indicator"></span></th>
            <th>Lat, Long</th>
            <th class="sortable" data-sort="mag">Magnitude<span class="sort-indicator"></span></th>
            <th>Location</th>
            <th class="sortable" data-sort="mmi">MMI<span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="shindo">Shindo<span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="alert">Alert<span class="sort-indicator"></span></th>
            <th class="sortable" data-sort="tsunami">Tsunami<span class="sort-indicator"></span></th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="eq-table-body">
        </tbody>
      </table>
    </section>

    <p id="load-more-wrap"><a href="#" id="load-more-link" class="hidden"></a></p>
  </section>

  <section id="detail-section" class="hidden">
    <div id="detail-panel">
      <p class="empty-note">Select an earthquake from the list or map to see technical details.</p>
    </div>
  </section>
</main>

<footer>
  <p>Data provided by the <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS Earthquake Hazards Program</a>.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="js/blob-store.js"></script>
<script src="js/cookies.js"></script>
<script src="js/timeformat.js"></script>
<script src="js/db.js"></script>
<script src="js/usgs.js"></script>
<script src="js/map.js"></script>
<script src="js/beachball.js"></script>
<script src="js/shindo.js"></script>
<script src="js/faultgeom.js"></script>
<script src="js/localestimate.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
