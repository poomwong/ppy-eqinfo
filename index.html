<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthquake Info Aggregator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Earthquake Info Aggregator</h1>
  <p class="subtitle">Global earthquakes, magnitude 6.0+ &mdash; source: USGS</p>
</header>

<main>
  <section id="db-bar">
    <button id="db-connect-existing">Open Existing eqinfo.sqlite</button>
    <button id="db-connect-new">Create New eqinfo.sqlite</button>
    <span id="db-status">Checking for a saved database connection...</span>
  </section>

  <section id="controls">
    <label for="days-select">Time range:</label>
    <select id="days-select">
      <option value="7">Past 7 days</option>
      <option value="30" selected>Past 30 days</option>
      <option value="90">Past 90 days</option>
      <option value="365">Past year</option>
    </select>
    <button id="refresh-btn" title="Force refetch the full list from USGS">Refresh All</button>
    <span id="status"></span>
  </section>

  <nav id="tab-bar">
    <button id="tab-list" class="tab-btn active">List &amp; Map</button>
    <button id="tab-detail" class="tab-btn" disabled>Details</button>
  </nav>

  <section id="list-section-wrap">
    <section id="map"></section>

    <section id="list-section">
      <table id="eq-table">
        <thead>
          <tr>
            <th>Date &amp; Time (UTC)</th>
            <th>Lat, Long</th>
            <th>Magnitude</th>
            <th>Location</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody id="eq-table-body">
        </tbody>
      </table>
    </section>
  </section>

  <section id="detail-section" class="hidden">
    <div id="detail-panel">
      <p class="empty-note">Select an earthquake from the list or map to see technical details.</p>
    </div>
  </section>
</main>

<footer>
  <p>Data provided by the <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS Earthquake Hazards Program</a>.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="js/handle-store.js"></script>
<script src="js/db.js"></script>
<script src="js/usgs.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
